<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles/style.css" />
    <link rel="shortcut icon" href="" type="image/x-icon" />

    <title>Article Preview - Component</title>
  </head>

  <body>
    <main>
      <section>
        <figure>
          <img
            class="drawers-img"
            src="assets/drawers.jpg"
            alt="Green drawers with a flower on top"
          />
        </figure>

        <article>
          <h1>
            Shift the overall look and feel by adding these wonderful touches to
            furniture in your home
          </h1>

          <p class="description">
            Ever been in a room and felt like something was missing? Perhaps it
            felt slightly bare and uninviting. I've got some simple tips to help
            you make any room feel complete.
          </p>

          <div class="container-profile">
            <img
              class="avatar-img"
              src="assets/avatar-michelle.jpg"
              alt="Michelle Profile Avatar "
            />

            <div class="box-profile">
              <p class="name-prof">Michelle Appleton</p>

              <p class="date-prof">28 Jun 2020</p>
            </div>

            <button id="share-btn">
              <img src="assets/icon-share.svg" alt="" />
            </button>
          </div>
        </article>
      </section>
    </main>

    <script src="scripts/script.js"></script>
  </body>
</html>
